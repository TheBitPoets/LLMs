name: Course CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF validator
        run: python3 -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Install CPU training runtime
        run: python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Structural checks
        run: |
          python3 scripts/scaffold_thebitlab_pack.py --check
          python3 scripts/scaffold_ai_software_pack.py --check
          python3 scripts/check_course.py
          python3 scripts/check_pdfs.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Parse JavaScript in visual labs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const name of fs.readdirSync('visuals').filter(x => x.endsWith('.html'))) {
            const html = fs.readFileSync(`visuals/${name}`, 'utf8');
            for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/gi)) {
              new Function(match[1]);
            }
            console.log(`${name}: JavaScript parses`);
          }
          NODE
