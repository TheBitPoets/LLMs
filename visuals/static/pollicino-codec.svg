<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Pollicino dalle probabilità alla ricostruzione esatta</title><desc id="desc">Encoder e decoder condividono modello e frequenze canoniche per ottenere gli stessi byte.</desc>
  <defs><style>.t{font:700 30px sans-serif;fill:#17345f}.s{font:21px sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#2457a6;stroke-width:3}.g{fill:#edf9f1;stroke:#25834c;stroke-width:3}.w{fill:#fff7e7;stroke:#bb7517;stroke-width:3}.a{stroke:#42536d;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42536d"/></marker></defs>
  <text class="t" x="600" y="48" text-anchor="middle">Pollicino: probabilità → bit → stessi byte</text>
  <rect class="b" x="55" y="180" width="190" height="110" rx="18"/><text class="s" x="150" y="225" text-anchor="middle">Byte originali</text><text class="s" x="150" y="257" text-anchor="middle">+ prefisso</text>
  <path class="a" d="M245 235 H300"/><rect class="g" x="300" y="130" width="230" height="210" rx="18"/><text class="s" x="415" y="185" text-anchor="middle">Modello causale</text><text class="s" x="415" y="220" text-anchor="middle">p(byte | prefisso)</text><text class="s" x="415" y="285" text-anchor="middle">quantizzazione</text><text class="s" x="415" y="315" text-anchor="middle">canonica</text>
  <path class="a" d="M530 235 H585"/><rect class="w" x="585" y="180" width="210" height="110" rx="18"/><text class="s" x="690" y="225" text-anchor="middle">Coder</text><text class="s" x="690" y="257" text-anchor="middle">aritmetico</text>
  <path class="a" d="M795 235 H850"/><rect class="b" x="850" y="180" width="295" height="110" rx="18"/><text class="s" x="997" y="220" text-anchor="middle">Bitstream + manifest</text><text class="s" x="997" y="252" text-anchor="middle">versione, lunghezza, hash</text>
  <path class="a" d="M997 290 C997 460 690 460 690 295"/><text class="s" x="690" y="505" text-anchor="middle">Il decoder ripete lo stesso modello e recupera ogni simbolo.</text><text class="t" x="600" y="560" text-anchor="middle">Gate: SHA-256(input) = SHA-256(output)</text>
</svg>
