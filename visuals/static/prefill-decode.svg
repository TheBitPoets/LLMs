<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Prefill, decode e KV cache</title><desc id="desc">Il prefill elabora il prompt in parallelo; il decode produce token riusando la cache.</desc>
  <defs><style>.t{font:700 30px sans-serif;fill:#17345f}.s{font:22px sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#2457a6;stroke-width:3}.g{fill:#edf9f1;stroke:#25834c;stroke-width:3}.a{stroke:#42536d;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42536d"/></marker></defs>
  <text class="t" x="600" y="48" text-anchor="middle">Due fasi, due profili di costo</text>
  <rect class="b" x="70" y="100" width="470" height="330" rx="22"/><text class="t" x="305" y="150" text-anchor="middle">Prefill</text>
  <rect class="g" x="115" y="190" width="160" height="90" rx="16"/><text class="s" x="195" y="245" text-anchor="middle">Prompt</text><path class="a" d="M275 235 H330"/><rect class="g" x="330" y="190" width="160" height="90" rx="16"/><text class="s" x="410" y="225" text-anchor="middle">Token in</text><text class="s" x="410" y="255" text-anchor="middle">parallelo</text><path class="a" d="M410 280 V335"/><text class="s" x="305" y="382" text-anchor="middle">Costruisce la KV cache</text>
  <rect class="b" x="660" y="100" width="470" height="330" rx="22"/><text class="t" x="895" y="150" text-anchor="middle">Decode</text>
  <rect class="g" x="705" y="190" width="170" height="90" rx="16"/><text class="s" x="790" y="225" text-anchor="middle">KV cache</text><text class="s" x="790" y="255" text-anchor="middle">riusata</text><path class="a" d="M875 235 H930"/><rect class="g" x="930" y="190" width="150" height="90" rx="16"/><text class="s" x="1005" y="225" text-anchor="middle">1 token</text><text class="s" x="1005" y="255" text-anchor="middle">per passo</text><path class="a" d="M1005 280 C1005 345 790 345 790 285"/>
  <text class="s" x="600" y="500" text-anchor="middle">TTFT misura soprattutto l'avvio; token/s descrive il decode sostenuto.</text>
</svg>

