<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Percorso dei dati locale e cloud</title><desc id="desc">Confronto tra elaborazione locale e servizio cloud con confini di fiducia.</desc>
  <defs><style>.t{font:700 30px sans-serif;fill:#17345f}.s{font:22px sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#2457a6;stroke-width:3}.g{fill:#edf9f1;stroke:#25834c;stroke-width:3}.w{fill:#fff7e7;stroke:#bb7517;stroke-width:3}.a{stroke:#42536d;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42536d"/></marker></defs>
  <text class="t" x="600" y="48" text-anchor="middle">Dove viaggia il prompt?</text>
  <rect class="b" x="70" y="100" width="240" height="100" rx="18"/><text class="s" x="190" y="145" text-anchor="middle">Applicazione</text><text class="s" x="190" y="175" text-anchor="middle">sul dispositivo</text>
  <path class="a" d="M310 150 H430"/><rect class="g" x="430" y="90" width="300" height="120" rx="18"/><text class="s" x="580" y="140" text-anchor="middle">Runtime + modello</text><text class="s" x="580" y="173" text-anchor="middle">confine locale</text>
  <path class="a" d="M310 150 C380 150 360 390 430 390"/><rect class="w" x="430" y="330" width="300" height="120" rx="18"/><text class="s" x="580" y="380" text-anchor="middle">API del provider</text><text class="s" x="580" y="413" text-anchor="middle">confine di rete</text>
  <path class="a" d="M730 390 H850"/><rect class="w" x="850" y="330" width="280" height="120" rx="18"/><text class="s" x="990" y="380" text-anchor="middle">Modello cloud</text><text class="s" x="990" y="413" text-anchor="middle">policy e retention</text>
  <text class="s" x="580" y="260" text-anchor="middle">Locale: controllare log, file e bind</text><text class="s" x="780" y="505" text-anchor="middle">Cloud: controllare dati, contratto e regione</text>
</svg>

