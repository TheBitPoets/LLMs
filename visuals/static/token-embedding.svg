<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Dal contenuto agli embedding</title><desc id="desc">Catena da testo o file a byte, token, identificatori ed embedding.</desc>
  <defs><style>.t{font:700 30px sans-serif;fill:#17345f}.s{font:22px sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#2457a6;stroke-width:3}.a{stroke:#42536d;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42536d"/></marker></defs>
  <text class="t" x="600" y="48" text-anchor="middle">Che cosa vede il modello?</text>
  <rect class="b" x="45" y="150" width="190" height="120" rx="18"/><text class="s" x="140" y="200" text-anchor="middle">Testo / file</text><text class="s" x="140" y="235" text-anchor="middle">“casa”</text>
  <path class="a" d="M235 210 H285"/><rect class="b" x="285" y="150" width="190" height="120" rx="18"/><text class="s" x="380" y="200" text-anchor="middle">Byte</text><text class="s" x="380" y="235" text-anchor="middle">63 61 73 61</text>
  <path class="a" d="M475 210 H525"/><rect class="b" x="525" y="150" width="190" height="120" rx="18"/><text class="s" x="620" y="200" text-anchor="middle">Token</text><text class="s" x="620" y="235" text-anchor="middle">“ca” + “sa”</text>
  <path class="a" d="M715 210 H765"/><rect class="b" x="765" y="150" width="160" height="120" rx="18"/><text class="s" x="845" y="200" text-anchor="middle">ID</text><text class="s" x="845" y="235" text-anchor="middle">4, 7</text>
  <path class="a" d="M925 210 H975"/><rect class="b" x="975" y="150" width="180" height="120" rx="18"/><text class="s" x="1065" y="200" text-anchor="middle">Embedding</text><text class="s" x="1065" y="235" text-anchor="middle">vettori</text>
  <text class="s" x="600" y="355" text-anchor="middle">L'ID è un indice; il significato emerge dai vettori e dal contesto.</text><text class="s" x="600" y="405" text-anchor="middle">Per un codec lossless: decode(encode(byte)) deve restituire gli stessi byte.</text>
</svg>
